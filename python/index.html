<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FastAPI 流式接口 Demo</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         max-width: 820px; margin: 40px auto; padding: 0 20px; color: #1f2328; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 28px; color: #57606a; font-weight: 600; }
  button { padding: 7px 14px; margin-right: 8px; font-size: 14px; cursor: pointer;
           border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; }
  button:hover { background: #eaeef2; }
  pre { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px;
        padding: 14px; min-height: 90px; white-space: pre-wrap; word-break: break-word;
        font-family: Consolas, Menlo, monospace; font-size: 13px; line-height: 1.7; }
  .timer { float: right; font-weight: normal; font-size: 13px; color: #57606a; }
  .hint { color: #57606a; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
  <h1>FastAPI 流式接口 Demo</h1>

  <h2>流式 NDJSON /stream/chat（模拟大模型打字）</h2>
  <button onclick="runStream('/stream/chat?q=流式接口有什么用', 'out3', 't3')">请求 /stream/chat</button>
  <span class="timer" id="t3"></span>
  <pre id="out3">—</pre>

<script>

// 流式：拿 response.body 的 reader，一边读一边往界面上贴
async function runStream(url, outId, timerId) {
  const out = document.getElementById(outId);
  const timer = document.getElementById(timerId);
  out.textContent = '';
  timer.textContent = '接收中…';

  const t0 = performance.now();
  let firstByteAt = null;
  let buffer = '';

  const res = await fetch(url);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();

  while (true) {
    const { done, value } = await reader.read();   // ← 每拿到一块就处理一次
    if (done) break;
    if (firstByteAt === null) {
      firstByteAt = (performance.now() - t0) / 1000;
      timer.textContent = `首字节 ${firstByteAt.toFixed(2)}s`;
    }
    const text = decoder.decode(value, { stream: true });

    // /stream/chat 是 NDJSON，每行一个 JSON，取 delta 字段
    if (url.startsWith('/stream/chat')) {
      buffer += text;
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const obj = JSON.parse(line);
        if (obj.done) break;
        out.textContent += obj.delta;
      }
    } else {
      out.textContent += text;
    }
  }
  timer.textContent += ` → 总耗时 ${((performance.now() - t0) / 1000).toFixed(2)}s`;
}
</script>
</body>
</html>
